<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 순례주택 2부 독서 퀴즈 & 생각 나누기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; margin: 0 auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; font-size: 24px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        p.desc { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        .help-text { font-size: 12px; color: #95a5a6; margin-bottom: 8px; display: block; }
        input[type="text"], input[type="radio"], textarea { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        input[type="radio"] { width: auto; margin-right: 5px; }
        .radio-label { font-weight: normal; display: inline-block; margin-right: 15px; margin-bottom: 5px; }
        textarea { height: 100px; resize: vertical; }
        button { background-color: #3498db; color: white; border: none; padding: 15px 20px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        .section-title { background-color: #e8f4f8; padding: 10px; border-radius: 5px; color: #2980b9; margin-top: 30px; margin-bottom: 15px; }
        #loading { display: none; text-align: center; color: #3498db; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 순례주택 2부 독서 활동</h1>
    <p class="desc">질문에 솔직하고 깊이 있는 여러분의 생각을 적어주세요.</p>

    <form id="quizForm">
        <!-- 학생 정보 -->
        <div class="form-group">
            <label>학번</label>
            <input type="text" name="student_id" placeholder="예: 10101" required>
        </div>
        <div class="form-group">
            <label>이름</label>
            <input type="text" name="name" placeholder="이름을 입력하세요" required>
        </div>

        <!-- 1단계: 내용 확인 -->
        <h2 class="section-title">💡 1단계: 내용 확인</h2>
        <div class="form-group">
            <label>1. 수림이를 키워주다시피 한 건물주 할머니의 이름은?</label>
            <input type="text" name="q1" placeholder="정답 입력" required>
        </div>
        <div class="form-group">
            <label>2. 수림이네 가족이 순례주택으로 이사 온 결정적 계기는?</label>
            <div><label class="radio-label"><input type="radio" name="q2" value="1" required> ① 재건축 대상이 되어서</label></div>
            <div><label class="radio-label"><input type="radio" name="q2" value="2"> ② 아빠의 사업 실패와 외할아버지의 돌아가심으로</label></div>
            <div><label class="radio-label"><input type="radio" name="q2" value="3"> ③ 순례 씨가 무료로 살게 해줘서</label></div>
            <div><label class="radio-label"><input type="radio" name="q2" value="4"> ④ 수림이 학교와 가까워서</label></div>
        </div>

        <!-- 2단계: 맥락 이해 -->
        <h2 class="section-title">🔍 2단계: 작품 맥락 이해</h2>
        <div class="form-group">
            <label>3. 수림이가 바라본 순례주택 사람들의 실제 삶의 태도는 어떠했나요?</label>
            <span class="help-text">가족들의 편견과 어떻게 달랐는지 적어보세요. (1~2줄)</span>
            <textarea name="q3" required></textarea>
        </div>
        <div class="form-group">
            <label>4. 수림이가 자기 가족(엄마, 아빠)을 바라보며 느낀 답답함/문제점은?</label>
            <textarea name="q4" required></textarea>
        </div>

        <!-- 3단계: 생각 넓히기 -->
        <h2 class="section-title">🤔 3단계: 인문학적 생각 넓히기</h2>
        <div class="form-group">
            <label>5. 내가 생각하는 '진짜 어른'이란?</label>
            <span class="help-text">순례 씨와 수림이 부모 중 누구에 더 가까워야 한다고 생각하는지 이유와 함께 적어보세요. (3줄 이상)</span>
            <textarea name="q5" required></textarea>
        </div>
        <div class="form-group">
            <label>6. 만약 내가 하루아침에 순례주택으로 이사 간다면?</label>
            <span class="help-text">가장 받아들이기 힘들었을 점과 그것을 어떻게 극복했을지 상상해 보세요.</span>
            <textarea name="q6" required></textarea>
        </div>

        <button type="submit">제출하기</button>
        <div id="loading">제출 중입니다. 잠시만 기다려주세요...</div>
    </form>
</div>

<script>
    // ★ 여기에 1단계 9번에서 복사한 구글 앱스 스크립트 웹 앱 URL을 넣으세요 ★
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzx44Ox17zV_5YVwLIFZ0Eb0tts5iJkIBvpGH4HzzHSCN-HCjOeTprlAbHPyMFaoloe2A/exec';
    
    const form = document.forms['quizForm'];
    const loading = document.getElementById('loading');

    form.addEventListener('submit', e => {
        e.preventDefault();
        loading.style.display = 'block';
        
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                loading.style.display = 'none';
                alert('제출이 완료되었습니다! 수고하셨습니다. 👍');
                form.reset();
            })
            .catch(error => {
                loading.style.display = 'none';
                alert('오류가 발생했습니다. 다시 시도해주세요.');
                console.error('Error!', error.message);
            });
    });
</script>

</body>
</html>
